<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#030713">
  <meta name="description" content="ANGELA Community — earn, contribute and grow inside the ANGELA ecosystem.">
  <title>ANGELA Community</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="stars"></div>
    <header class="topbar">
      <button class="icon-btn" aria-label="Menu">☰</button>
      <div class="brand-mini"><img src="assets/angela-logo.png" alt="ANGELA"></div>
      <button class="icon-btn" aria-label="Notifications">◌</button>
    </header>
    <main id="screen" class="screen"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>HOME</small></button>
      <button data-page="tasks" class="nav-item"><span>✓</span><small>TASKS</small></button>
      <button data-page="core" class="core-btn" aria-label="ANGELA Core"><img src="assets/angela-logo.png" alt=""></button>
      <button data-page="community" class="nav-item"><span>♧</span><small>COMMUNITY</small></button>
      <button data-page="wallet" class="nav-item"><span>▱</span><small>WALLET</small></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
